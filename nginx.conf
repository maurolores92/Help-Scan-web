server {
    listen 3001;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compresión Gzip para rendimiento óptimo
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml image/svg+xml;

    # Cabeceras de seguridad estándar
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Caché agresivo para assets compilados por Vite e imágenes estáticas
    location ~* ^/(assets|images)/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Sin caché para index.html para reflejar despliegues de inmediato
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        try_files $uri =404;
    }

    # Fallback SPA para rutas React
    location / {
        try_files $uri $uri/ /index.html;
    }
}
